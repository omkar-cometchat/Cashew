allprojects {
    repositories {
        google()
        jcenter()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
    project.evaluationDependsOn(':app')
    project.plugins.withId('com.android.application') {
        project.android.compileOptions {
            sourceCompatibility JavaVersion.VERSION_17
            targetCompatibility JavaVersion.VERSION_17
        }
    }
    project.plugins.withId('com.android.library') {
        if (!project.android.namespace) {
            def fallbackNamespace = project.group?.toString()
            if (!fallbackNamespace || fallbackNamespace == 'unspecified') {
                fallbackNamespace = "com.cashew.${project.name.replaceAll('[^A-Za-z0-9_]', '_')}"
            }
            project.android.namespace = fallbackNamespace
        }
        project.android.compileOptions {
            sourceCompatibility JavaVersion.VERSION_17
            targetCompatibility JavaVersion.VERSION_17
        }
    }
    project.plugins.withId('org.jetbrains.kotlin.android') {
        project.tasks.configureEach { task ->
            if (task.hasProperty('kotlinOptions')) {
                task.kotlinOptions.jvmTarget = '17'
            }
        }
    }
    project.plugins.withId('kotlin-android') {
        project.tasks.configureEach { task ->
            if (task.hasProperty('kotlinOptions')) {
                task.kotlinOptions.jvmTarget = '17'
            }
        }
    }
}

gradle.projectsEvaluated {
    subprojects { project ->
        if (project.extensions.findByName('android') != null) {
            project.android.compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }
        project.tasks.configureEach { task ->
            if (task.hasProperty('kotlinOptions')) {
                task.kotlinOptions.jvmTarget = '17'
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
